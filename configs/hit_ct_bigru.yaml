seed: 42
device: auto

data:
  data_dir: data/hit_full
  class_names:
    - Healthy
    - Inner Fault
    - Outer Fault

model:
  name: ct_bigru
  input_channels: 4
  num_classes: 3
  conv_channels: [64, 128]
  kernel_sizes: [32, 16]
  strides: [8, 4]
  paddings: [12, 8]
  pooled_length: 128
  embed_dim: 128
  transformer_layers: 2
  attention_heads: 8
  ffn_dim: 512
  conv_dropout: 0.4
  transformer_dropout: 0.1
  gru_hidden: 128
  classifier_hidden: 64
  classifier_dropout: 0.5

training:
  output_dir: outputs/hit_ct_bigru
  batch_size: 16
  epochs: 50
  min_epochs: 50
  early_stop_patience: 20
  augment_train: true
  class_weight: true
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0

